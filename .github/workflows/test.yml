name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LD_LIBRARY_PATH: /usr/local/lib
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build ANTLR4 C++ runtime
        run: |
          git clone --depth 1 --branch 4.13.2 https://github.com/antlr/antlr4.git /tmp/antlr4
          cmake -S /tmp/antlr4/runtime/Cpp -B /tmp/antlr4/build \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DANTLR_BUILD_CPP_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/antlr4/build -j$(nproc)
          sudo cmake --install /tmp/antlr4/build
          sudo ldconfig

      - name: Build compiler
        run: |
          cmake -S compiler -B compiler/build -DCMAKE_BUILD_TYPE=Release
          cmake --build compiler/build -j$(nproc)

      - name: Parse-check all test sources
        run: |
          mapfile -t files < <(find tests -type f -name '*.rx' ! -path '*/parser/*' ! -path '*/lexer/*')
          for f in "${files[@]}"; do
            if ! compiler/build/compiler --stage semantic "$f" >/tmp/parse.out 2>&1; then
              echo "parse failed: $f"
              cat /tmp/parse.out
              exit 1
            fi
          done
          echo "parsed ${#files[@]} files successfully"
